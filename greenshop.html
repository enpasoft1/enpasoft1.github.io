<!DOCTYPE html>
<html lang="en">
<head>

 <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1hdTnVuCSC___QjS6IkQUY9ws28q8-9GCTQFjeeG7hQ&s=10">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      border: none;
    }
    
    /* Ensure proper scaling on mobile devices */
    @media screen and (max-width: 768px) {
      iframe {
        min-height: calc(100vh - env(safe-area-inset-bottom));
      }
    }
  </style>
</head>

    src="https://script.google.com/macros/s/AKfycby3oTjk86TkFOkmwgElCa2pExsHrKVFSwYM__mjO0LMfMhm5crVeQITqSi3r8s-8lRXUw/exec"
